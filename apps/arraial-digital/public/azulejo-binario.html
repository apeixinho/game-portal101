<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Azulejo Binário · Arraial Digital</title>
    <style>
      :root {
        --blue: #3b82f6;
        --yellow: #f5d442;
        --orange: #ff7a2b;
        --purple: #2a1248;
        --cream: #fff4e0;
        --green: #2ecc71;
        --red: #e74c3c;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        font-family: "Nunito", system-ui, sans-serif;
        color: var(--cream);
        background: radial-gradient(ellipse at 50% -10%, #2f5fb0 0%, #2a1248 50%, #160826 100%);
      }
      .wrap { max-width: 640px; margin: 0 auto; padding: 1.5rem 1.2rem 4rem; }
      .topbar {
        display: flex; align-items: center; justify-content: space-between;
        gap: 1rem; margin-bottom: 1.5rem;
      }
      .back {
        display: inline-flex; align-items: center; gap: 0.4rem;
        text-decoration: none; color: var(--cream);
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px; padding: 0.5rem 1rem; font-weight: 700; font-size: 0.9rem;
      }
      .back:hover { background: rgba(255, 255, 255, 0.16); }
      h1 {
        font-family: "Lilita One", system-ui, cursive; font-weight: 400;
        margin: 0; font-size: 1.4rem; color: var(--yellow);
      }
      .card {
        background: linear-gradient(160deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 22px; padding: 1.5rem;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      }
      .meta {
        display: flex; justify-content: space-between;
        font-size: 0.85rem; color: rgba(255, 244, 224, 0.75); margin-bottom: 1rem;
      }
      .target {
        text-align: center; margin-bottom: 0.4rem;
      }
      .target small {
        display: block; text-transform: uppercase; letter-spacing: 0.2em;
        font-size: 0.7rem; color: rgba(255, 244, 224, 0.7);
      }
      .target b {
        font-family: "Lilita One", system-ui, cursive; font-weight: 400;
        font-size: 3.2rem; color: var(--yellow); line-height: 1.1;
      }
      .hint { text-align: center; font-size: 0.85rem; color: rgba(255,244,224,0.7); margin: 0 0 1.2rem; }
      .tiles {
        display: grid; grid-template-columns: repeat(8, 1fr); gap: 0.5rem; margin-bottom: 0.5rem;
      }
      .tile {
        aspect-ratio: 1 / 1; border-radius: 12px; cursor: pointer;
        border: 2px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.06); color: var(--cream);
        font-size: 1.4rem; font-weight: 800; display: flex;
        align-items: center; justify-content: center;
        transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease;
      }
      .tile:hover { transform: translateY(-2px); }
      .tile.on {
        background: linear-gradient(150deg, var(--blue), #1e3a8a);
        border-color: var(--yellow);
        box-shadow: 0 0 18px rgba(59, 130, 246, 0.6);
      }
      .weights {
        display: grid; grid-template-columns: repeat(8, 1fr); gap: 0.5rem;
        margin-bottom: 1.3rem; font-size: 0.7rem; text-align: center;
        color: rgba(255, 244, 224, 0.6);
      }
      .readout {
        text-align: center; font-size: 1.1rem; margin-bottom: 1.2rem;
      }
      .readout b { color: var(--yellow); font-size: 1.3rem; }
      .actions { display: flex; gap: 0.7rem; }
      .btn {
        flex: 1; padding: 0.95rem; border: 0; border-radius: 14px;
        font-size: 1rem; font-weight: 800; letter-spacing: 0.03em;
        text-transform: uppercase; cursor: pointer;
      }
      .btn-check { color: var(--purple); background: linear-gradient(120deg, var(--yellow), var(--orange)); }
      .btn-clear { color: var(--cream); background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.2); }
      .feedback { margin-top: 1.1rem; min-height: 1.5rem; font-weight: 800; text-align: center; }
      .end { text-align: center; }
      .end .score-big {
        font-family: "Lilita One", system-ui, cursive; font-size: 3rem;
        color: var(--yellow); margin: 0.4rem 0;
      }
      .badge {
        display: inline-block; background: rgba(245, 212, 66, 0.18);
        border: 1px solid var(--yellow); border-radius: 999px;
        padding: 0.3rem 0.9rem; font-weight: 800; font-size: 0.85rem; color: var(--yellow);
      }
      .best { color: rgba(255, 244, 224, 0.8); margin-bottom: 1.4rem; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="topbar">
        <a class="back" href="/">← Voltar</a>
        <h1>🔢 Azulejo Binário</h1>
      </div>

      <div class="card" id="game">
        <div class="meta">
          <span id="round">Ronda 1 de 6</span>
          <span id="score">Pontos: 0</span>
        </div>

        <div class="target">
          <small>Converte para binário o número</small>
          <b id="targetNum">0</b>
        </div>
        <p class="hint">Acende os azulejos para somar até ao número. Cada azulejo vale o seu peso.</p>

        <div class="tiles" id="tiles"></div>
        <div class="weights" id="weights"></div>

        <p class="readout">Valor atual: <b id="current">0</b> · Binário: <b id="binary">00000000</b></p>

        <div class="actions">
          <button class="btn btn-clear" id="clear">Limpar</button>
          <button class="btn btn-check" id="check">Verificar</button>
        </div>
        <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
      </div>
    </div>

    <script>
      const STORAGE_KEY = "arraial-digital:azulejo-binario:best";
      const BITS = [128, 64, 32, 16, 8, 4, 2, 1];
      const ROUNDS = 6;

      const els = {
        round: document.getElementById("round"),
        score: document.getElementById("score"),
        target: document.getElementById("targetNum"),
        tiles: document.getElementById("tiles"),
        weights: document.getElementById("weights"),
        current: document.getElementById("current"),
        binary: document.getElementById("binary"),
        feedback: document.getElementById("feedback"),
        check: document.getElementById("check"),
        clear: document.getElementById("clear"),
        game: document.getElementById("game"),
      };

      let state = BITS.map(() => 0);
      let round = 1;
      let score = 0;
      let target = 0;

      function newTarget() {
        // Avoid 0 so there is always something to light up.
        target = 1 + Math.floor(Math.random() * 255);
        els.target.textContent = target;
      }

      function buildTiles() {
        els.tiles.innerHTML = "";
        els.weights.innerHTML = "";
        BITS.forEach((weight, i) => {
          const tile = document.createElement("button");
          tile.className = "tile";
          tile.dataset.i = i;
          tile.textContent = "0";
          tile.addEventListener("click", () => toggle(i, tile));
          els.tiles.appendChild(tile);

          const w = document.createElement("span");
          w.textContent = weight;
          els.weights.appendChild(w);
        });
      }

      function toggle(i, tile) {
        state[i] = state[i] ? 0 : 1;
        tile.classList.toggle("on", state[i] === 1);
        tile.textContent = String(state[i]);
        updateReadout();
      }

      function value() {
        return state.reduce((sum, bit, i) => sum + bit * BITS[i], 0);
      }

      function updateReadout() {
        els.current.textContent = value();
        els.binary.textContent = state.join("");
      }

      function reset() {
        state = BITS.map(() => 0);
        [...els.tiles.querySelectorAll(".tile")].forEach((t) => {
          t.classList.remove("on");
          t.textContent = "0";
        });
        updateReadout();
        els.feedback.textContent = "";
      }

      els.clear.addEventListener("click", reset);

      els.check.addEventListener("click", () => {
        const v = value();
        if (v === target) {
          score += 10;
          els.score.textContent = `Pontos: ${score}`;
          els.feedback.style.color = "var(--green)";
          els.feedback.textContent = `✅ Certo! ${target} = ${state.join("")}`;
          setTimeout(nextRound, 900);
        } else {
          els.feedback.style.color = "var(--red)";
          els.feedback.textContent = v > target
            ? `❌ ${v} é demais. Apaga alguns azulejos.`
            : `❌ ${v} ainda é pouco. Acende mais.`;
        }
      });

      function nextRound() {
        round += 1;
        if (round > ROUNDS) {
          finish();
          return;
        }
        els.round.textContent = `Ronda ${round} de ${ROUNDS}`;
        reset();
        newTarget();
      }

      function finish() {
        const max = ROUNDS * 10;
        const prevBest = Number(localStorage.getItem(STORAGE_KEY) || 0);
        const best = Math.max(prevBest, score);
        localStorage.setItem(STORAGE_KEY, String(best));
        const isNewRecord = score > prevBest;

        els.game.innerHTML = `
          <div class="end">
            <p class="badge">${isNewRecord ? "🏆 Novo recorde!" : "Resultado"}</p>
            <p class="score-big">${score} / ${max}</p>
            <p>${score === max ? "Parabéns! Dominas o sistema binário! 🔢" : "Bom trabalho! Continua a praticar a conversão."}</p>
            <p class="best">Melhor pontuação: <strong>${best}</strong></p>
            <button class="btn btn-check" id="again">Jogar outra vez ↻</button>
          </div>
        `;
        document.getElementById("again").addEventListener("click", () => location.reload());
      }

      buildTiles();
      newTarget();
      updateReadout();
    </script>
  </body>
</html>
