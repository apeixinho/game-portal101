<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Robô dos Açores · Arraial Digital</title>
    <style>
      :root { --orange:#ff7a2b; --pink:#c22b5f; --yellow:#f5d442; --purple:#2a1248; --cream:#fff4e0; --green:#2ecc71; --red:#e74c3c; }
      * { box-sizing:border-box; }
      html, body { margin:0; min-height:100%; font-family:"Nunito",system-ui,sans-serif; color:var(--cream);
        background:radial-gradient(ellipse at 50% -10%, #5a2a8c 0%, #2a1248 45%, #160826 100%); }
      .wrap { max-width:560px; margin:0 auto; padding:1.5rem 1.2rem 4rem; }
      .topbar { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1.2rem; }
      .back { display:inline-flex; align-items:center; gap:.4rem; text-decoration:none; color:var(--cream);
        background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:.5rem 1rem; font-weight:700; font-size:.9rem; }
      .back:hover { background:rgba(255,255,255,.16); }
      h1 { font-family:"Lilita One",system-ui,cursive; font-weight:400; margin:0; font-size:1.3rem; color:var(--yellow); }
      .card { background:linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,.03)); border:1px solid rgba(255,255,255,.12);
        border-radius:22px; padding:1.3rem; box-shadow:0 20px 50px rgba(0,0,0,.4); }
      .meta { display:flex; justify-content:space-between; font-size:.85rem; color:rgba(255,244,224,.8); margin-bottom:.8rem; }
      .meta b { color:var(--yellow); }
      .grid { display:grid; gap:4px; justify-content:center; margin:0 auto 1rem; }
      .cell { width:46px; height:46px; border-radius:10px; background:rgba(255,255,255,.06); display:flex; align-items:center; justify-content:center; font-size:1.6rem; }
      .cell.obst { background:rgba(0,0,0,.35); }
      .program { min-height:2.4rem; display:flex; flex-wrap:wrap; gap:.3rem; padding:.6rem; background:rgba(0,0,0,.2); border-radius:12px; margin-bottom:.8rem; }
      .program span { font-size:1.3rem; }
      .pad { display:grid; grid-template-columns:repeat(4,1fr); gap:.5rem; margin-bottom:.7rem; }
      .key { padding:.8rem; border-radius:12px; border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.08); color:var(--cream); font-size:1.4rem; cursor:pointer; }
      .key:hover { background:rgba(255,255,255,.16); }
      .actions { display:flex; gap:.5rem; }
      .btn { flex:1; padding:.85rem; border:0; border-radius:12px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; cursor:pointer; }
      .btn-run { color:var(--purple); background:linear-gradient(120deg,var(--yellow),var(--orange)); }
      .btn-clear { color:var(--cream); background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); }
      .feedback { text-align:center; margin-top:.9rem; min-height:1.4rem; font-weight:800; }
      .hint { text-align:center; font-size:.85rem; color:rgba(255,244,224,.7); margin:.2rem 0 1rem; }
      .end { text-align:center; }
      .end .score-big { font-family:"Lilita One",system-ui,cursive; font-size:2.6rem; color:var(--yellow); margin:.3rem 0; }
      .best { color:rgba(255,244,224,.8); margin-bottom:1.2rem; }
      .badge { display:inline-block; background:rgba(245,212,66,.18); border:1px solid var(--yellow); border-radius:999px; padding:.3rem .9rem; font-weight:800; font-size:.85rem; color:var(--yellow); }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="topbar"><a class="back" href="/">← Voltar</a><h1>🤖 Robô dos Açores</h1></div>
      <div class="card" id="game">
        <div class="meta"><span>Nível <b id="level">1</b> de 3</span><span>Pontos: <b id="score">0</b></span></div>
        <p class="hint">Programa o robô para apanhar o ananás 🍍 sem bater nas pedras.</p>
        <div class="grid" id="grid"></div>
        <div class="program" id="program"></div>
        <div class="pad">
          <button class="key" data-dir="up">⬆️</button>
          <button class="key" data-dir="down">⬇️</button>
          <button class="key" data-dir="left">⬅️</button>
          <button class="key" data-dir="right">➡️</button>
        </div>
        <div class="actions">
          <button class="btn btn-clear" id="clear">Apagar</button>
          <button class="btn btn-run" id="run">Executar ▶</button>
        </div>
        <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
      </div>
    </div>
    <script>
      const STORAGE_KEY = "arraial-digital:robo-dos-acores:best";
      const LEVELS = [
        { cols:4, rows:3, start:[2,0], goal:[0,3], obst:[] },
        { cols:5, rows:4, start:[3,0], goal:[0,4], obst:[[1,1],[2,2]] },
        { cols:5, rows:5, start:[4,0], goal:[0,4], obst:[[3,1],[2,2],[1,3],[3,3]] },
      ];
      const DIRS = { up:[-1,0], down:[1,0], left:[0,-1], right:[0,1] };
      const ARROW = { up:"⬆️", down:"⬇️", left:"⬅️", right:"➡️" };
      const els = { level:g("level"), score:g("score"), grid:g("grid"), program:g("program"), feedback:g("feedback"), run:g("run"), clear:g("clear"), game:g("game") };
      function g(id){ return document.getElementById(id); }
      let levelIndex=0, score=0, program=[], robot, running=false;
      function level(){ return LEVELS[levelIndex]; }
      function isObst(r,c){ return level().obst.some(o=>o[0]===r&&o[1]===c); }
      function load(){
        const L=level(); robot=[...L.start]; program=[]; running=false;
        els.level.textContent=levelIndex+1; els.feedback.textContent=""; renderProgram(); draw();
      }
      function draw(){
        const L=level(); els.grid.style.gridTemplateColumns=`repeat(${L.cols},46px)`; els.grid.innerHTML="";
        for(let r=0;r<L.rows;r++) for(let c=0;c<L.cols;c++){
          const cell=document.createElement("div"); cell.className="cell"+(isObst(r,c)?" obst":"");
          if(robot[0]===r&&robot[1]===c) cell.textContent="🤖";
          else if(L.goal[0]===r&&L.goal[1]===c) cell.textContent="🍍";
          else if(isObst(r,c)) cell.textContent="🪨";
          els.grid.appendChild(cell);
        }
      }
      function renderProgram(){ els.program.innerHTML = program.length ? program.map(d=>`<span>${ARROW[d]}</span>`).join("") : '<span style="opacity:.4;font-size:.9rem">O teu programa aparece aqui…</span>'; }
      document.querySelectorAll(".key").forEach(k=>k.addEventListener("click",()=>{ if(running) return; program.push(k.dataset.dir); renderProgram(); }));
      els.clear.addEventListener("click",()=>{ if(running) return; program.pop(); renderProgram(); });
      els.run.addEventListener("click",run);
      function run(){
        if(running||program.length===0) return; running=true; const L=level(); robot=[...L.start]; draw();
        let i=0;
        const timer=setInterval(()=>{
          const [dr,dc]=DIRS[program[i]]; const nr=robot[0]+dr, nc=robot[1]+dc;
          if(nr<0||nc<0||nr>=L.rows||nc>=L.cols||isObst(nr,nc)){
            clearInterval(timer); els.feedback.style.color="var(--red)"; els.feedback.textContent="💥 O robô bateu! Tenta outro programa.";
            running=false; setTimeout(load, 1200); return;
          }
          robot=[nr,nc]; draw(); i++;
          if(robot[0]===L.goal[0]&&robot[1]===L.goal[1]){
            clearInterval(timer); score+=20; els.score.textContent=score; els.feedback.style.color="var(--green)"; els.feedback.textContent="✅ Ananás apanhado!";
            running=false; setTimeout(next, 1100); return;
          }
          if(i>=program.length){
            clearInterval(timer); els.feedback.style.color="var(--red)"; els.feedback.textContent="🤔 Não chegaste ao ananás. Tenta de novo.";
            running=false; setTimeout(load, 1200);
          }
        }, 420);
      }
      function next(){ levelIndex++; if(levelIndex>=LEVELS.length) finish(); else load(); }
      function finish(){
        const prev=Number(localStorage.getItem(STORAGE_KEY)||0); const best=Math.max(prev,score);
        localStorage.setItem(STORAGE_KEY,String(best)); const rec=score>prev;
        els.game.innerHTML=`<div class="end"><p class="badge">${rec?"🏆 Novo recorde!":"Missão cumprida"}</p>
          <p class="score-big">${score}</p>
          <p>Parabéns! Programaste o robô em todos os níveis. 🤖🍍</p>
          <p class="best">Melhor pontuação: <strong>${best}</strong></p>
          <button class="btn btn-run" id="again" style="max-width:240px;margin:0 auto">Jogar outra vez ↻</button></div>`;
        document.getElementById("again").addEventListener("click",()=>location.reload());
      }
      load();
    </script>
  </body>
</html>
