name: Deploy caracois-matematica

on:
  push:
    branches: [main]
    paths:
      - "apps/caracois-matematica/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter caracois-matematica build

      - uses: junobuild/juno-action@v0.7.3
        with:
          args: deploy --config-path apps/caracois-matematica/juno.config.mjs
        env:
          JUNO_TOKEN: ${{ secrets.JUNO_TOKEN }}
          # Satellite principal ID (public); set as repo Variable so juno.config.mjs picks it up.
          JUNO_CARACOIS_MATEMATICA_SATELLITE_PROD: ${{ vars.JUNO_CARACOIS_MATEMATICA_SATELLITE_PROD }}
